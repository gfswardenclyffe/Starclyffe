<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starclyffe — Staging</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f7f8ff;background:#050d20}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% 55%,#142f5b 0%,#0b1a38 42%,#050b1a 85%);height:100dvh}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:fixed;top:0;left:0;right:0;padding:24px clamp(20px,3vw,48px);display:flex;justify-content:space-between;align-items:center;z-index:4;pointer-events:none}.brand{font:italic 38px Georgia,serif;letter-spacing:-2px;color:#fff;text-decoration:none;pointer-events:auto;text-shadow:0 0 20px #b2ceff44}.actions{display:flex;gap:12px;pointer-events:auto}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:2px solid #d5e8ff;outline-offset:4px}.round{width:40px;height:40px;border:1px solid #ffffff35;border-radius:50%;background:#ffffff10;color:white;backdrop-filter:blur(10px)}nav{position:fixed;z-index:4;right:clamp(16px,3.8vw,60px);top:50%;transform:translateY(-50%);display:grid;gap:11px}.world{border:1px solid #ffffff60;background:#f7f8f8;color:#151f32;border-radius:40px;padding:13px 22px;text-align:left;min-width:175px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;transition:transform .25s,box-shadow .25s}.world:hover{transform:translateX(-8px);box-shadow:0 0 28px #b9d7ff55}.world:before{content:'✦';color:#607cae;margin-right:12px}footer{position:fixed;bottom:0;left:0;right:0;padding:20px clamp(20px,3vw,48px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:18px;color:#d6e1f4b0;font-size:11px;letter-spacing:.03em}footer a{color:inherit;text-decoration:none}footer a:hover{text-decoration:underline}.social{display:flex;gap:17px}.notice{position:fixed;z-index:6;top:85px;right:25px;max-width:330px;padding:22px;background:#0b1a33ed;border:1px solid #ffffff30;border-radius:16px;box-shadow:0 12px 60px #0006;display:none}.notice h2{font:normal 28px Georgia,serif;margin:0 0 10px}.notice p{font-size:13px;line-height:1.7;color:#d5e1f2}.notice button{background:none;color:#fff;border:0;text-decoration:underline}.hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:3;font-size:11px;color:#c4d6ef9c;letter-spacing:.15em;text-transform:uppercase;pointer-events:none}.overlay{position:fixed;inset:0;background:#07152d;z-index:8;opacity:0;pointer-events:none;transition:opacity 1.1s}.overlay.on{opacity:1;pointer-events:auto}.stage-label{position:fixed;left:24px;top:95px;z-index:4;font-size:10px;color:#ffffff80;letter-spacing:.2em} @media(max-width:700px){header{padding:18px}.brand{font-size:30px}nav{top:auto;right:12px;left:12px;bottom:95px;transform:none;display:flex;gap:6px}.world{min-width:0;flex:1;padding:12px 7px;font-size:9px;text-align:center;letter-spacing:.02em}.world:before{display:none}footer{padding:16px;flex-wrap:wrap;justify-content:center;font-size:9px;gap:12px}.social{gap:12px}.hint{bottom:154px}.stage-label{top:75px;left:18px}}@media(prefers-reduced-motion:reduce){.overlay{transition:none}.world{transition:none}}
</style></head><body>
<canvas id="universe" aria-label="Interactive star cluster. Drag to explore."></canvas>
<header><a class="brand" href="./" aria-label="Starclyffe home">Starclyffe ✦</a><div class="actions"><button class="round" id="info" aria-label="About Starclyffe">i</button><button class="round" id="sound" aria-label="Enable music" aria-pressed="false">♫</button><button class="round" id="reset" aria-label="Reset view">↺</button></div></header>
<div class="stage-label">STAGING PREVIEW · WORK IN PROGRESS</div>
<nav aria-label="Explore Starclyffe"><button class="world" data-page="games.html">Games</button><button class="world" data-page="music.html">Music</button><button class="world" data-page="data-analysis.html">Data Analysis</button></nav>
<div class="hint">Drag to explore the stars</div>
<section class="notice" id="notice"><h2>Follow your curiosity.</h2><p>Welcome to Starclyffe. A universe of music, games, and discoveries waiting to unfold.</p><button id="close">Close</button></section>
<div class="overlay" id="overlay"></div>
<footer><span>© 2026 Team Starclyffe. All rights reserved.</span><div class="social"><span title="Social profiles will be linked when confirmed">X · YouTube · Facebook · TikTok · Discord</span></div><a href="mailto:brandon.shields@starclyffe.com">Contact</a></footer>
<script>
const canvas=document.getElementById('universe'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,stars=[],bg=[],drag=false,lastX=0,lastY=0,rotX=0,rotY=0,targetX=0,targetY=0,launch=performance.now(),travel=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function random(seed){let v=Math.sin(seed*127.1+78.233)*43758.5453;return v-Math.floor(v)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function makeStars(){stars=[];for(let i=0;i<2300;i++){let u=random(i+11),v=random(i+39),a=u*Math.PI*2,r=Math.sqrt(v),z=(random(i+76)-.5)*2;stars.push({x:Math.cos(a)*r,y:Math.sin(a)*r*.78,z,r:.45+random(i+91)*1.2,t:random(i+22)*9,blue:random(i+63),birth:random(i+100)*4.2})}bg=[];for(let i=0;i<420;i++)bg.push({x:random(i+401),y:random(i+801),r:.3+random(i+901)*.9,p:random(i+951)*6.28})}
function frame(ms){let t=ms/1000,elapsed=(ms-launch)/1000;rotX+=(targetX-rotX)*.035;rotY+=(targetY-rotY)*.035;ctx.clearRect(0,0,w,h);
for(let s of bg){let x=s.x*w+rotX*7,y=s.y*h+rotY*7;ctx.fillStyle='rgba(206,225,255,'+(.15+.2*Math.sin(t*.45+s.p)) +')';ctx.beginPath();ctx.arc(x,y,s.r,0,7);ctx.fill()}
let cx=w*(w<700?.5:.49),cy=h*.49,scale=Math.min(w*.34,h*.43,345);let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*1.35);glow.addColorStop(0,'#7da9f922');glow.addColorStop(.42,'#668fe111');glow.addColorStop(1,'#426cc000');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,scale*1.35,0,7);ctx.fill();
let visible=0;for(let s of stars){let alpha=reduced?1:Math.max(0,Math.min(1,(elapsed-s.birth)*.6));if(!alpha)continue;let c=Math.cos(rotX),si=Math.sin(rotX),px=s.x*c-s.z*si,pz=s.x*si+s.z*c;let cyy=Math.cos(rotY),sy=Math.sin(rotY),py=s.y*cyy-pz*sy;let perspective=1/(1+pz*.2);let x=cx+px*scale*perspective,y=cy+py*scale*perspective;let twinkle=.73+.27*Math.sin(t*(.4+s.blue*.8)+s.t);let bright=(1-s.r*.18)*alpha*twinkle;ctx.fillStyle='rgba('+(s.blue>.65?'171,207,255':'237,245,255')+','+Math.min(1,bright)+')';ctx.beginPath();ctx.arc(x,y,s.r*(.65+perspective*.45),0,7);ctx.fill();visible++}
if(!reduced)requestAnimationFrame(frame)}
resize();makeStars();addEventListener('resize',resize);requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;targetX+=(e.clientX-lastX)*.004;targetY+=(e.clientY-lastY)*.004;lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
document.getElementById('reset').onclick=()=>{targetX=0;targetY=0};document.getElementById('info').onclick=()=>document.getElementById('notice').style.display='block';document.getElementById('close').onclick=()=>document.getElementById('notice').style.display='none';
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.getElementById('overlay').classList.add('on');setTimeout(()=>location.href=b.dataset.page,reduced?50:900)});
const audio=new Audio('assets/starclyffe-ambient.mp3');audio.loop=true;audio.volume=.22;const sound=document.getElementById('sound');sound.onclick=async()=>{if(!audio.paused){audio.pause();sound.textContent='♫';sound.setAttribute('aria-pressed','false');return}try{await audio.play();sound.textContent='♪';sound.setAttribute('aria-pressed','true')}catch(e){sound.title='Audio track will be added to staging after upload';sound.textContent='♫';alert('Audio is not yet uploaded to staging. The supplied composition is ready for the next step.')}};
</script></body></html>
